<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punet e servisit</title>
    <link rel="stylesheet" href="punet.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar__inner">
            <nav class="main-nav" aria-label="Navigimi kryesor">
                <a class="main-nav__link" href="#">Faqja Kryesore</a>
                <a class="main-nav__link main-nav__link--active" href="#" aria-current="page">Punët</a>
                <a class="main-nav__link" href="#">Staff</a>
                <a class="main-nav__link" href="#">Klientet</a>
            </nav>

            <div class="account-actions">
                <button class="icon-button" id="notificationBtn" type="button" aria-label="Shfaq njoftimet">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 8-3 8h18s-3-1-3-8Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="notification-badge">2</span>
                </button>

                <span class="account-divider" aria-hidden="true"></span>

                <div class="profile">
                    <button class="profile__button" id="profileBtn" type="button" aria-expanded="false" aria-controls="profileMenu">
                        <span>Profili</span>
                        <svg class="profile__chevron" id="profileChevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>

                    <div class="profile-menu" id="profileMenu">
                        <div class="profile-menu__user">
                            <strong>User Name</strong>
                            <span>Administrator</span>
                        </div>
                        <button class="profile-menu__logout" id="logoutBtn" type="button">Dil nga llogaria</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="page">
        <section class="hero" aria-labelledby="pageTitle">
            <h1 id="pageTitle">Shiko të gjitha punët</h1>
            <p>Në këtë seksion mund të shikoni të gjitha punët dhe statusin e tyre.</p>
        </section>

        <section class="jobs-panel" aria-labelledby="jobsTitle">
            <div class="jobs-panel__header">
                <h2 id="jobsTitle">Punët e servisit</h2>
                <label class="search" for="jobSearch">
                    <svg class="search__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
                        <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2.3"/>
                    </svg>
                    <input id="jobSearch" type="search" placeholder="Kërko punë sipas targës dhe numrit të telefonit">
                </label>
            </div>

            <section class="job-section" aria-labelledby="activeJobsTitle">
                <div class="section-title">
                    <span aria-hidden="true"></span>
                    <h3 id="activeJobsTitle">Punet Aktive</h3>
                    <span aria-hidden="true"></span>
                </div>
                <div class="jobs-grid" id="activeJobs"></div>
            </section>

            <section class="job-section" aria-labelledby="finishedJobsTitle">
                <div class="section-title">
                    <span aria-hidden="true"></span>
                    <h3 id="finishedJobsTitle">Punet e Perfunduara</h3>
                    <span aria-hidden="true"></span>
                </div>
                <div class="jobs-grid" id="finishedJobs"></div>
            </section>

            <p class="empty-state" id="emptyState" hidden>Nuk u gjet asnjë punë me këtë kërkim.</p>
        </section>
    </main>

    <script src="punet.js"></script>
</body>
</html>
